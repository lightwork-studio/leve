name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: Start a new iOS build even if the installed one can take an update
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  # Each deploy job publishes only when its release secrets are configured. Forks have none, so
  # their deploy jobs skip with a warning instead of failing.
  deploy-ios:
    needs: check
    environment: testflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A slower run can finish CI later. Keep queued jobs so it cannot evict a newer revision.
    concurrency:
      group: deploy-ios-${{ github.ref }}
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for TestFlight credentials
        id: credentials
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          ready="$(bash .github/scripts/release-credentials.sh             EXPO_TOKEN ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID)"
          if [ "$ready" = false ]; then
            echo "::warning::TestFlight secrets are not configured. Skipping the iOS deploy."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready == 'true'
      - name: Write the App Store Connect key outside the project
        if: steps.credentials.outputs.ready == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
      - name: Publish an update, or build and upload to TestFlight
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          COMMIT: ${{ github.sha }}
          FORCE_BUILD: ${{ inputs.build == true }}
          LEVE_RELEASE_BASE: ${{ vars.LEVE_RELEASE_BASE }}
        run: |
          : "${LEVE_RELEASE_BASE:?Set the release base before enabling TestFlight deployments.}"
          COMMIT="${COMMIT::7}" ./scripts/deploy-ios.sh

  deploy-site:
    needs: check
    environment: cloudflare-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-site
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check for Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready="$(bash .github/scripts/release-credentials.sh             CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)"
          if [ "$ready" = false ]; then
            echo "::warning::Cloudflare secrets are not configured. Skipping the site deploy."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready == 'true'
      - run: pnpm build:site
        if: steps.credentials.outputs.ready == 'true'
        env:
          LEVE_SITE_SOURCE_REVISION: ${{ github.sha }}
      - name: Publish to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tip="$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_SHA is no longer the tip of $GITHUB_REF ($tip). Skipping."
            exit 0
          fi
          npx --yes wrangler@4.158.0 pages deploy apps/site/dist \
            --project-name=leve --branch=main --commit-hash="$GITHUB_SHA"
