name: App Store
on:
  workflow_run:
    workflows: ["App Store tag"]
    types: [completed]
  workflow_dispatch:
    inputs:
      store_tag:
        description: Release tag of the currently approved App Store binary
        type: string
        required: true
      commit:
        description: Full main commit SHA to publish as an approved OTA fix
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: app-store
  queue: max
jobs:
  verify:
    if: >-
      vars.LEVE_APP_STORE_ENABLED == 'true' && vars.LEVE_RELEASE_REPOSITORY == github.repository &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tag: ${{ steps.verify.outputs.tag }}
      tag_commit: ${{ steps.verify.outputs.tag_commit }}
      mode: ${{ steps.verify.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release revision
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TAG: ${{ github.event.workflow_run.head_branch }}
          PUSH_COMMIT: ${{ github.event.workflow_run.head_sha }}
          OTA_TAG: ${{ inputs.store_tag }}
          OTA_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            tag="$PUSH_TAG"
            commit="$PUSH_COMMIT"
            mode=build
          else
            tag="$OTA_TAG"
            commit="$OTA_COMMIT"
            mode=ota
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$commit"
          if [ "$mode" = build ]; then test "$tag_commit" = "$commit"; fi
          for revision in "$tag_commit" "$commit"; do
            if ! git merge-base --is-ancestor "$revision" origin/main ||
              ! gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$revision/pulls" \
                --jq '.[] | select(.merged_at != null and .base.ref == "main") | .merge_commit_sha' |
                grep -Fx "$revision" >/dev/null; then
              echo "App Store revisions must match a merged PR on main: $revision" >&2
              exit 1
            fi
            if [ "$tag_commit" = "$commit" ]; then break; fi
          done
          printf 'tag=%s\ntag_commit=%s\ncommit=%s\nmode=%s\n' \
            "$tag" "$tag_commit" "$commit" "$mode" >> "$GITHUB_OUTPUT"
          printf 'App Store %s request\n\n- Release tag: %s at %s\n- Revision: %s\n' \
            "$mode" "$tag" "$tag_commit" "$commit" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The production sync Worker (`leve-sync-prod`) serves App Store builds. A store build deploys
  # its release tag's revision before the app is published, so a release never reaches users
  # before its server. OTA fixes don't deploy the server, and the Worker only moves forward: a
  # tag older than the newest release on main is never deployed.
  deploy-sync:
    needs: verify
    runs-on: ubuntu-latest
    environment: sync-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.tag_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this release deploys the server
        id: credentials
        env:
          RELEASE_MODE: ${{ needs.verify.outputs.mode }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready="$(bash .github/scripts/release-credentials.sh \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)"
          newest="$(git tag --list 'v*' --merged origin/main --sort=-v:refname | head -n 1)"
          if [ "$ready" = false ]; then
            echo "::warning::Production sync Worker secrets are not configured. Skipping the sync deploy."
          elif [ "$RELEASE_MODE" != build ]; then
            echo "OTA fixes don't deploy the sync Worker. Skipping."
            ready=false
          elif [ "$newest" != "$RELEASE_TAG" ]; then
            echo "::warning::$RELEASE_TAG is older than $newest, which the Worker may already run. Skipping the sync deploy."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.ready == 'true'
      - name: Deploy the production sync Worker
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/sync-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.tag_commit }}
        run: pnpm run deploy:prod --message="$RELEASE_TAG $RELEASE_COMMIT"
  publish:
    needs: [verify, deploy-sync]
    runs-on: ubuntu-latest
    environment: app-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish approved OTA or queue a store build
        working-directory: apps/mobile
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_MODE: ${{ needs.verify.outputs.mode }}
          LEVE_STORE_TAG_COMMIT: ${{ needs.verify.outputs.tag_commit }}
          LEVE_APPROVED_STORE_TAG: ${{ vars.LEVE_APPROVED_STORE_TAG }}
          LEVE_APPROVED_STORE_BUILD_NUMBER: ${{ vars.LEVE_APPROVED_STORE_BUILD_NUMBER }}
          LEVE_PRODUCTION_EAS_PROJECT_ID: ${{ vars.LEVE_PRODUCTION_EAS_PROJECT_ID }}
          LEVE_PRODUCTION_ASC_APP_ID: ${{ vars.LEVE_PRODUCTION_ASC_APP_ID }}
          LEVE_PRODUCTION_APPLE_TEAM_ID: ${{ vars.LEVE_PRODUCTION_APPLE_TEAM_ID }}
          EXPO_TOKEN: ${{ secrets.LEVE_STORE_EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.LEVE_STORE_ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.LEVE_STORE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.LEVE_STORE_ASC_API_ISSUER_ID }}
        run: |
          if [ "$RELEASE_MODE" = build ]; then
            : "${ASC_API_KEY_P8:?Configure the production App Store Connect API key.}"
            umask 077
            export ASC_API_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
            trap 'rm -f "$ASC_API_KEY_PATH"' EXIT
            printf '%s\n' "$ASC_API_KEY_P8" > "$ASC_API_KEY_PATH"
          fi
          unset ASC_API_KEY_P8
          bash ./scripts/release-store.sh "$RELEASE_TAG" "$RELEASE_MODE"
